name: Xplorer Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Polices (Google Fonts, licence OFL)
        run: |
          set -e
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/space_grotesk.ttf "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/manrope.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope%5Bwght%5D.ttf"
          ls -la app/src/main/res/font

      - name: Contrôle de sécurité (aucun ordre, aucun retrait)
        run: |
          # L'app ne doit contenir aucun appel aux endpoints qui passent des ordres ou déplacent des fonds.
          if grep -rniE "orders/batch_cancel|brokerage/orders\"|/orders/edit|/v2/accounts/[^\"]*/(transactions\"\s*,\s*method|withdrawals|deposits)|\"POST\"|\.post\(|\.put\(|\.delete\(" app/src/main/java; then
            echo "Appel d'écriture détecté : refusé."; exit 1
          fi
          echo "OK : uniquement des lectures (GET)."

      - name: Endpoints publics Coinbase (intégration)
        run: |
          set -e
          curl -fsS "https://api.coinbase.com/api/v3/brokerage/market/products/BTC-EUR/candles?granularity=ONE_DAY&start=$(( $(date +%s) - 86400*10 ))&end=$(date +%s)" | python3 -c "import sys,json; c=json.load(sys.stdin)['candles']; assert len(c)>3 and all(k in c[0] for k in ('start','open','high','low','close','volume')); print('Bougies OK', len(c))"
          curl -fsS "https://api.coinbase.com/v2/exchange-rates?currency=EUR" | python3 -c "import sys,json; r=json.load(sys.stdin)['data']['rates']; assert 'BTC' in r; print('Taux OK, GEOD présent :', 'GEOD' in r)"
          curl -fsS "https://api.coinbase.com/api/v3/brokerage/market/products?product_type=SPOT&limit=5" | python3 -c "import sys,json; p=json.load(sys.stdin)['products']; assert p and 'product_id' in p[0]; print('Produits OK')"

      - name: Tests unitaires
        run: |
          set -o pipefail
          gradle :app:testReleaseUnitTest --no-daemon --console=plain 2>&1 | tee -a build.log

      - name: Bilan des tests
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for x in glob.glob('app/build/test-results/testReleaseUnitTest/*.xml'):
              r=ET.parse(x).getroot(); t+=int(r.get('tests')); f+=int(r.get('failures')); e+=int(r.get('errors')); s+=int(r.get('skipped'))
              print(r.get('name'), r.get('tests'), 'tests')
          print(f"::notice::Tests unitaires : {t} exécutés, {f} échecs, {e} erreurs, {s} ignorés")
          assert t > 0 and f == 0 and e == 0
          PY

      - name: Signature
        env:
          KS_B64: ${{ secrets.XP_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.XP_STORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "XP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "XP_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Signature : secrets GitHub."
          else
            # Transition : clé du dépôt (voir docs/SIGNATURE.md pour passer aux secrets GitHub)
            echo "XP_STORE_PASSWORD=xplorer-maikel" >> "$GITHUB_ENV"
            echo "::warning::Signature avec la clé du dépôt. Ajoute les secrets XP_KEYSTORE_B64 et XP_STORE_PASSWORD."
          fi
          echo "XP_VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Compilation APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee -a build.log

      - name: Vérification de l'APK
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs "$APK" | head -3
          $BT/aapt2 dump badging "$APK" | head -3
          if $BT/aapt2 dump permissions "$APK" | grep -viE "INTERNET|NETWORK_STATE|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|WAKE_LOCK|FOREGROUND_SERVICE|DYNAMIC_RECEIVER|package:|uses-permission: name='be.maikel" | grep -i "uses-permission"; then
            echo "Permission inattendue"; exit 1
          fi
          cp "$APK" Xplorer.apk
          ls -la Xplorer.apk

      - name: Erreurs lisibles
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Could not|Unresolved|expected|Exception|AssertionError|at be\.maikel" build.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done || true
          for f in $(ls app/build/test-results/testReleaseUnitTest/*.xml 2>/dev/null); do grep -A3 "<failure" "$f" | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; done || true

      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK de test (branches)
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-apk
          path: Xplorer.apk

      - name: Pré-version de test (branches)
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.ref_name }}-${{ github.run_number }}
          name: "TEST ${{ github.ref_name }} (${{ github.run_number }})"
          body: |
            Version de test, non publiée comme version officielle. Installe Xplorer.apk pour essayer.
          files: Xplorer.apk
          prerelease: true
          make_latest: false

      - name: Publication
        if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-release]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Xplorer’ 2.0.${{ github.run_number }}
          body: |
            Xplorer’ natif (Kotlin + Jetpack Compose). Installe Xplorer.apk sur ton Samsung.
            Tests unitaires et contrôle « lecture seule » passés avant publication.
          files: Xplorer.apk
          make_latest: true
