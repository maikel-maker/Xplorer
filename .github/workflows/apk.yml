name: APK Xplorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tests du moteur
        run: node test/engine.test.mjs && node test/ta.test.mjs

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Polices
        run: |
          mkdir -p www/fonts
          cp "$(ls node_modules/@fontsource-variable/space-grotesk/files/*-latin-wght-normal.woff2 | grep -v latin-ext | head -1)" www/fonts/space-grotesk.woff2
          cp "$(ls node_modules/@fontsource-variable/manrope/files/*-latin-wght-normal.woff2 | grep -v latin-ext | head -1)" www/fonts/manrope.woff2
          ls -la www/fonts

      - name: Projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#070B16' --iconBackgroundColorDark '#070B16' --splashBackgroundColor '#070B16' --splashBackgroundColorDark '#070B16'
          npx cap sync android

      - name: Version et permissions
        run: |
          VC=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $VC/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$VC\"/" android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          cat $M

      - name: Compilation
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $IN aligned.apk
          $BT/apksigner sign --ks keystore/xplorer.jks --ks-key-alias xplorer \
            --ks-pass pass:xplorer-maikel --key-pass pass:xplorer-maikel --out Xplorer.apk aligned.apk
          $BT/apksigner verify Xplorer.apk
          ls -la Xplorer.apk

      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Xplorer 1.0.${{ github.run_number }}
          body: APK Android d'Xplorer. Installe Xplorer.apk sur ton téléphone.
          files: Xplorer.apk
          make_latest: true
